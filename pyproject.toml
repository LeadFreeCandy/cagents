[project]
name = "cagents"
version = "0.1.0"
description = "A lightweight terminal supervisor for Claude Code and Codex sessions"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
cagents = "cagents.__main__:main"
cagents-ctx = "cagents.ctx:tmux_entry"
cagents3 = "cagents.direct_cli:main"
cagents3-ctx = "cagents.direct_ctx:tmux_entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
